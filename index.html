<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survivor</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d14; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }
  canvas { display: block; }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(5,6,12,.78); z-index: 10; text-align: center; }
  .overlay.show { display: flex; }
  h1 { font-size: 56px; margin: 0 0 8px; letter-spacing: 2px; color: #ffcc4d; text-shadow: 0 0 24px #ff8a00aa; }
  h2 { font-size: 32px; margin: 0 0 20px; color: #ffcc4d; }
  p { color: #b8bdd6; margin: 6px 0; }
  button { font: inherit; }
  .btn { margin-top: 24px; padding: 14px 36px; font-size: 20px; font-weight: 700; border: 0; border-radius: 10px; background: #ffcc4d; color: #1a1300; cursor: pointer; }
  .btn:hover { background: #ffd970; }
  .cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .card { width: 210px; padding: 20px 16px; border-radius: 14px; background: #1a1e2e; border: 2px solid #343a55; cursor: pointer; text-align: left; color: #fff; transition: transform .1s, border-color .1s; }
  .card:hover { transform: translateY(-4px); border-color: #ffcc4d; }
  .card .icon { font-size: 34px; }
  .card .name { font-size: 18px; font-weight: 700; margin: 8px 0 4px; }
  .card .lvl { font-size: 12px; color: #ffcc4d; text-transform: uppercase; letter-spacing: 1px; }
  .card .desc { font-size: 14px; color: #b8bdd6; margin-top: 6px; }
  .card .key { float: right; font-size: 12px; color: #6c7393; }
  kbd { background: #262b40; border-radius: 4px; padding: 2px 6px; font-size: 13px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="overlay show">
  <h1>SURVIVOR</h1>
  <p>Survis aux vagues le plus longtemps possible.</p>
  <p>Déplacement : <kbd>ZQSD</kbd> / <kbd>WASD</kbd> / <kbd>flèches</kbd> &nbsp;·&nbsp; Pause : <kbd>Échap</kbd></p>
  <p>Tes armes tirent toutes seules. Ramasse les gemmes pour monter de niveau.</p>
  <button class="btn" id="startBtn">Jouer</button>
  <p id="best" style="margin-top:18px"></p>
</div>

<div id="levelup" class="overlay">
  <h2>Niveau supérieur !</h2>
  <div class="cards" id="cards"></div>
  <p style="margin-top:18px">Choisis une amélioration (clic ou <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>)</p>
</div>

<div id="pause" class="overlay">
  <h2>Pause</h2>
  <button class="btn" id="resumeBtn">Reprendre</button>
</div>

<div id="gameover" class="overlay">
  <h1>GAME OVER</h1>
  <p id="stats"></p>
  <button class="btn" id="retryBtn">Rejouer</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize);
resize();

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Escape' && state === 'play') setState('pause');
  else if (e.key === 'Escape' && state === 'pause') setState('play');
  if (state === 'levelup' && ['1', '2', '3'].includes(e.key)) pickUpgrade(+e.key - 1);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') setState('pause'); });

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const fmtTime = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

// ---------- Upgrades ----------
const UPGRADES = {
  bolt:   { icon: '✨', name: 'Projectile magique', max: 8, desc: l => l === 0 ? 'Tire sur l\'ennemi le plus proche.' : '+1 projectile, +dégâts' },
  orbit:  { icon: '🌀', name: 'Lames orbitales', max: 6, desc: l => l === 0 ? 'Des lames tournent autour de toi.' : '+1 lame, +dégâts' },
  aura:   { icon: '🔥', name: 'Aura brûlante', max: 6, desc: l => l === 0 ? 'Brûle les ennemis proches.' : '+rayon, +dégâts' },
  nova:   { icon: '💥', name: 'Onde de choc', max: 5, desc: l => l === 0 ? 'Explosion périodique qui repousse.' : '+dégâts, plus fréquente' },
  speed:  { icon: '👟', name: 'Bottes', max: 5, desc: () => '+12% vitesse de déplacement' },
  hp:     { icon: '❤️', name: 'Vitalité', max: 5, desc: () => '+25 PV max et soin complet' },
  magnet: { icon: '🧲', name: 'Aimant', max: 4, desc: () => '+50% rayon de ramassage' },
  rate:   { icon: '⏱️', name: 'Frénésie', max: 5, desc: () => '-10% temps de recharge des armes' },
  regen:  { icon: '🌿', name: 'Régénération', max: 4, desc: () => '+0.6 PV par seconde' },
};

// ---------- Game state ----------
let state = 'menu';
let player, enemies, bullets, gems, particles, texts, novas, time, kills, spawnTimer, shake, choices, bossTimer;

function newGame() {
  player = {
    x: 0, y: 0, r: 14, speed: 190, hp: 100, maxHp: 100, regen: 0,
    level: 1, xp: 0, xpNext: 5, magnet: 90, cdMul: 1, invuln: 0,
    lv: { bolt: 1, orbit: 0, aura: 0, nova: 0, speed: 0, hp: 0, magnet: 0, rate: 0, regen: 0 },
    boltCd: 0, novaCd: 0, orbitAngle: 0, auraTick: 0, facing: 1,
  };
  enemies = []; bullets = []; gems = []; particles = []; texts = []; novas = [];
  time = 0; kills = 0; spawnTimer = 0; shake = 0; bossTimer = 60;
}

function setState(s) {
  state = s;
  for (const id of ['menu', 'levelup', 'pause', 'gameover']) document.getElementById(id).classList.toggle('show', id === s);
  last = performance.now();
}

// ---------- Enemies ----------
const ENEMY_TYPES = {
  grunt: { r: 12, hp: 12, speed: 75, dmg: 8,  xp: 1, color: '#e0485a' },
  bat:   { r: 9,  hp: 7,  speed: 135, dmg: 6, xp: 1, color: '#b06cff' },
  brute: { r: 22, hp: 70, speed: 50, dmg: 18, xp: 5, color: '#6fbf4a' },
  boss:  { r: 42, hp: 900, speed: 62, dmg: 30, xp: 40, color: '#ff8a00' },
};

function spawnEnemy(type) {
  const t = ENEMY_TYPES[type];
  const a = rand(0, Math.PI * 2);
  const d = Math.hypot(W, H) / 2 + 60;
  const scale = 1 + time / 90; // enemies get tougher over time
  enemies.push({
    type, x: player.x + Math.cos(a) * d, y: player.y + Math.sin(a) * d,
    r: t.r, hp: t.hp * scale, maxHp: t.hp * scale, speed: t.speed * rand(0.9, 1.1),
    dmg: t.dmg, xp: t.xp, color: t.color, hit: 0, kx: 0, ky: 0,
  });
}

function spawnWave(dt) {
  spawnTimer -= dt;
  const interval = Math.max(0.08, 0.9 - time / 120);
  while (spawnTimer <= 0) {
    spawnTimer += interval;
    if (enemies.length >= 450) continue; // cap to keep the frame rate smooth
    const roll = Math.random();
    if (time > 90 && roll < 0.08) spawnEnemy('brute');
    else if (time > 30 && roll < 0.35) spawnEnemy('bat');
    else spawnEnemy('grunt');
  }
  bossTimer -= dt;
  if (bossTimer <= 0) {
    bossTimer = 60;
    spawnEnemy('boss');
    floatText(player.x, player.y - 60, 'UN BOSS ARRIVE !', '#ff8a00', 22);
  }
}

function damageEnemy(e, dmg, kx = 0, ky = 0) {
  e.hp -= dmg;
  e.hit = 0.1;
  e.kx += kx; e.ky += ky;
  floatText(e.x, e.y - e.r, Math.round(dmg), '#fff', 14);
}

function killEnemy(e) {
  kills++;
  gems.push({ x: e.x, y: e.y, v: e.xp, r: e.xp >= 5 ? 7 : 4 });
  if (e.type === 'boss' || Math.random() < 0.012) gems.push({ x: e.x + 10, y: e.y, heal: true, r: 7 });
  burst(e.x, e.y, e.color, e.type === 'boss' ? 40 : 10);
  if (e.type === 'boss') shake = 18;
}

// ---------- Effects ----------
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(40, 220);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), max: 0.7, color, r: rand(2, 4) });
  }
}
function floatText(x, y, txt, color, size) { texts.push({ x, y, txt, color, size, life: 0.8 }); }

// ---------- Weapons ----------
function nearestEnemy(range) {
  let best = null, bd = range * range;
  for (const e of enemies) { const d = dist2(e, player); if (d < bd) { bd = d; best = e; } }
  return best;
}

function updateWeapons(dt) {
  const L = player.lv;

  // Magic bolt
  player.boltCd -= dt;
  if (L.bolt && player.boltCd <= 0) {
    const target = nearestEnemy(600);
    if (target) {
      player.boltCd = 0.8 * player.cdMul;
      const count = L.bolt;
      const base = Math.atan2(target.y - player.y, target.x - player.x);
      for (let i = 0; i < count; i++) {
        const a = base + (i - (count - 1) / 2) * 0.16;
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, r: 5, dmg: 8 + L.bolt * 3, life: 1.2, pierce: 1 + Math.floor(L.bolt / 3) });
      }
    }
  }

  // Orbiting blades
  if (L.orbit) {
    player.orbitAngle += dt * (2.6 + L.orbit * 0.2);
    const n = L.orbit + 1, R = 70 + L.orbit * 4, dmg = 6 + L.orbit * 3;
    for (let i = 0; i < n; i++) {
      const a = player.orbitAngle + i * Math.PI * 2 / n;
      const bx = player.x + Math.cos(a) * R, by = player.y + Math.sin(a) * R;
      for (const e of enemies) {
        if ((e.x - bx) ** 2 + (e.y - by) ** 2 < (e.r + 10) ** 2 && (e.orbitHit ?? 0) <= 0) {
          damageEnemy(e, dmg, Math.cos(a) * 120, Math.sin(a) * 120);
          e.orbitHit = 0.35;
        }
      }
    }
  }

  // Burning aura
  if (L.aura) {
    player.auraTick -= dt;
    if (player.auraTick <= 0) {
      player.auraTick = 0.4;
      const R = 60 + L.aura * 14;
      for (const e of enemies) if (dist2(e, player) < (R + e.r) ** 2) damageEnemy(e, 3 + L.aura * 2);
    }
  }

  // Shockwave
  if (L.nova) {
    player.novaCd -= dt;
    if (player.novaCd <= 0) {
      player.novaCd = (5 - L.nova * 0.6) * player.cdMul;
      novas.push({ x: player.x, y: player.y, r: 0, max: 200, life: 0.4 });
      for (const e of enemies) {
        const d = Math.sqrt(dist2(e, player));
        if (d < 200) {
          const nx = (e.x - player.x) / (d || 1), ny = (e.y - player.y) / (d || 1);
          damageEnemy(e, 20 + L.nova * 12, nx * 500, ny * 500);
        }
      }
      shake = Math.max(shake, 6);
    }
  }
}

// ---------- Level up ----------
function gainXp(v) {
  player.xp += v;
  // While the choice screen is open, keep the XP; pickUpgrade chains the next level-up
  if (state === 'levelup') return;
  if (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.floor(5 + player.level * 4 + player.level ** 1.5);
    openLevelUp();
  }
}

function openLevelUp() {
  const pool = Object.keys(UPGRADES).filter(k => player.lv[k] < UPGRADES[k].max);
  choices = pool.sort(() => Math.random() - 0.5).slice(0, 3);
  if (!choices.length) { player.hp = player.maxHp; return; }
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  choices.forEach((k, i) => {
    const u = UPGRADES[k], l = player.lv[k];
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = `<span class="key">${i + 1}</span><div class="icon">${u.icon}</div><div class="name">${u.name}</div>
      <div class="lvl">${l === 0 ? 'Nouveau' : 'Niveau ' + (l + 1)}</div><div class="desc">${u.desc(l)}</div>`;
    b.onclick = () => pickUpgrade(i);
    cards.appendChild(b);
  });
  setState('levelup');
}

function pickUpgrade(i) {
  const k = choices?.[i];
  if (!k) return;
  player.lv[k]++;
  if (k === 'speed') player.speed *= 1.12;
  if (k === 'hp') { player.maxHp += 25; player.hp = player.maxHp; }
  if (k === 'magnet') player.magnet *= 1.5;
  if (k === 'rate') player.cdMul *= 0.9;
  if (k === 'regen') player.regen += 0.6;
  choices = null;
  setState('play');
  // Several level-ups can stack if lots of XP arrived at once
  if (player.xp >= player.xpNext) gainXp(0);
}

// ---------- Update ----------
function update(dt) {
  time += dt;

  // Movement
  let dx = 0, dy = 0;
  if (keys['z'] || keys['w'] || keys['arrowup']) dy--;
  if (keys['s'] || keys['arrowdown']) dy++;
  if (keys['q'] || keys['a'] || keys['arrowleft']) dx--;
  if (keys['d'] || keys['arrowright']) dx++;
  if (dx || dy) {
    const m = Math.hypot(dx, dy);
    player.x += dx / m * player.speed * dt;
    player.y += dy / m * player.speed * dt;
    if (dx) player.facing = Math.sign(dx);
  }
  player.hp = Math.min(player.maxHp, player.hp + player.regen * dt);
  player.invuln -= dt;

  spawnWave(dt);
  updateWeapons(dt);

  // Bullets
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of enemies) {
      if (b.pierce > 0 && e.hp > 0 && dist2(b, e) < (b.r + e.r) ** 2 && e.lastBullet !== b) {
        e.lastBullet = b;
        damageEnemy(e, b.dmg, b.vx * 0.15, b.vy * 0.15);
        b.pierce--;
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0 && b.pierce > 0);

  // Enemies
  const despawn = (Math.hypot(W, H) + 400) ** 2;
  for (const e of enemies) {
    const d = Math.sqrt(dist2(e, player)) || 1;
    e.x += ((player.x - e.x) / d * e.speed + e.kx) * dt;
    e.y += ((player.y - e.y) / d * e.speed + e.ky) * dt;
    e.kx *= 0.88; e.ky *= 0.88;
    e.hit -= dt;
    if (e.orbitHit) e.orbitHit -= dt;
    if (d < e.r + player.r && player.invuln <= 0) {
      player.hp -= e.dmg;
      player.invuln = 0.5;
      shake = Math.max(shake, 8);
      floatText(player.x, player.y - 24, '-' + e.dmg, '#ff4d6d', 18);
    }
    // Recycle far-away enemies around the player instead of letting them pile up off-screen
    if (e.type !== 'boss' && dist2(e, player) > despawn) {
      const a = rand(0, Math.PI * 2), r = Math.hypot(W, H) / 2 + 60;
      e.x = player.x + Math.cos(a) * r; e.y = player.y + Math.sin(a) * r;
    }
  }
  // Light separation so enemies don't stack into one blob
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    for (let j = i + 1; j < Math.min(enemies.length, i + 12); j++) {
      const b = enemies[j];
      const dx2 = b.x - a.x, dy2 = b.y - a.y, min = a.r + b.r, d2 = dx2 * dx2 + dy2 * dy2;
      if (d2 < min * min && d2 > 0) {
        const d = Math.sqrt(d2), push = (min - d) / 2;
        a.x -= dx2 / d * push; a.y -= dy2 / d * push;
        b.x += dx2 / d * push; b.y += dy2 / d * push;
      }
    }
  }
  for (const e of enemies) if (e.hp <= 0) killEnemy(e);
  enemies = enemies.filter(e => e.hp > 0);

  // Gems
  for (const g of gems) {
    const d = Math.sqrt(dist2(g, player));
    if (d < player.magnet) {
      const s = 420 * (1 - d / player.magnet) + 160;
      g.x += (player.x - g.x) / d * s * dt;
      g.y += (player.y - g.y) / d * s * dt;
    }
    if (d < player.r + g.r) {
      g.taken = true;
      if (g.heal) { player.hp = Math.min(player.maxHp, player.hp + 30); floatText(player.x, player.y - 24, '+30', '#5be37d', 18); }
      else gainXp(g.v);
    }
  }
  gems = gems.filter(g => !g.taken);

  // Effects
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const t of texts) { t.y -= 40 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  for (const n of novas) { n.life -= dt; n.r = n.max * (1 - n.life / 0.4); }
  novas = novas.filter(n => n.life > 0);
  shake *= 0.85;

  if (player.hp <= 0) gameOver();
}

function gameOver() {
  let best = 0;
  try { best = +localStorage.getItem('survivor-best') || 0; } catch {}
  const record = time > best;
  if (record) try { localStorage.setItem('survivor-best', time); } catch {}
  document.getElementById('stats').innerHTML =
    `Survécu <b>${fmtTime(time)}</b> · Niveau <b>${player.level}</b> · <b>${kills}</b> ennemis vaincus` +
    (record ? '<br><span style="color:#ffcc4d">🏆 Nouveau record !</span>' : `<br>Record : ${fmtTime(Math.max(best, time))}`);
  setState('gameover');
}

// ---------- Draw ----------
function draw() {
  ctx.fillStyle = '#0b0d14';
  ctx.fillRect(0, 0, W, H);
  if (!player) return;

  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  const cx = W / 2 - player.x + sx, cy = H / 2 - player.y + sy;
  ctx.save();
  ctx.translate(cx, cy);

  // Ground grid
  const g = 64, x0 = Math.floor((player.x - W / 2) / g) * g, y0 = Math.floor((player.y - H / 2) / g) * g;
  ctx.strokeStyle = '#151a28'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x < player.x + W / 2 + g; x += g) { ctx.moveTo(x, y0); ctx.lineTo(x, y0 + H + g * 2); }
  for (let y = y0; y < player.y + H / 2 + g; y += g) { ctx.moveTo(x0, y); ctx.lineTo(x0 + W + g * 2, y); }
  ctx.stroke();

  // Aura
  if (player.lv.aura) {
    const R = 60 + player.lv.aura * 14;
    const grad = ctx.createRadialGradient(player.x, player.y, R * 0.3, player.x, player.y, R);
    grad.addColorStop(0, 'rgba(255,120,40,0)'); grad.addColorStop(1, 'rgba(255,120,40,0.22)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(player.x, player.y, R, 0, Math.PI * 2); ctx.fill();
  }

  // Novas
  for (const n of novas) {
    ctx.strokeStyle = `rgba(120,200,255,${n.life / 0.4})`; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.stroke();
  }

  // Gems
  for (const gm of gems) {
    ctx.fillStyle = gm.heal ? '#5be37d' : gm.v >= 5 ? '#ff5ec4' : '#4dd2ff';
    ctx.beginPath();
    if (gm.heal) ctx.arc(gm.x, gm.y, gm.r, 0, Math.PI * 2);
    else { ctx.moveTo(gm.x, gm.y - gm.r * 1.4); ctx.lineTo(gm.x + gm.r, gm.y); ctx.lineTo(gm.x, gm.y + gm.r * 1.4); ctx.lineTo(gm.x - gm.r, gm.y); }
    ctx.fill();
  }

  // Enemies
  for (const e of enemies) {
    ctx.fillStyle = e.hit > 0 ? '#fff' : e.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    // eyes
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    ctx.fillStyle = '#0b0d14';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(e.x + Math.cos(a + s * 0.5) * e.r * 0.5, e.y + Math.sin(a + s * 0.5) * e.r * 0.5, Math.max(2, e.r * 0.15), 0, Math.PI * 2);
      ctx.fill();
    }
    if (e.type === 'boss' || e.type === 'brute') {
      ctx.fillStyle = '#300'; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2, 5);
      ctx.fillStyle = '#ff4d6d'; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2 * Math.max(0, e.hp / e.maxHp), 5);
    }
  }

  // Bullets
  ctx.fillStyle = '#ffe680';
  for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }

  // Orbit blades
  if (player.lv.orbit) {
    const n = player.lv.orbit + 1, R = 70 + player.lv.orbit * 4;
    ctx.fillStyle = '#9fe3ff';
    for (let i = 0; i < n; i++) {
      const a = player.orbitAngle + i * Math.PI * 2 / n;
      ctx.save();
      ctx.translate(player.x + Math.cos(a) * R, player.y + Math.sin(a) * R);
      ctx.rotate(a * 3);
      ctx.fillRect(-10, -3, 20, 6);
      ctx.restore();
    }
  }

  // Player
  if (player.invuln <= 0 || Math.floor(player.invuln * 20) % 2) {
    ctx.fillStyle = '#ffcc4d';
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1300';
    ctx.beginPath(); ctx.arc(player.x + player.facing * 5, player.y - 3, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // Particles & texts
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.r, p.r);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.font = `700 ${t.size}px system-ui`;
    ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHud();
}

function drawHud() {
  // XP bar
  ctx.fillStyle = '#1a1e2e'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = '#4dd2ff'; ctx.fillRect(0, 0, W * player.xp / player.xpNext, 10);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = '700 28px system-ui'; ctx.fillText(fmtTime(time), W / 2, 48);
  ctx.textAlign = 'left'; ctx.font = '600 16px system-ui';
  ctx.fillText(`Niv. ${player.level}`, 16, 36);
  ctx.fillText(`💀 ${kills}`, 16, 60);
  // HP bar
  const bw = 220;
  ctx.fillStyle = '#300'; ctx.fillRect(W - bw - 16, 24, bw, 16);
  ctx.fillStyle = '#ff4d6d'; ctx.fillRect(W - bw - 16, 24, bw * Math.max(0, player.hp / player.maxHp), 16);
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = '600 13px system-ui';
  ctx.fillText(`${Math.ceil(Math.max(0, player.hp))} / ${player.maxHp}`, W - 20, 37);
  // Owned weapons
  ctx.textAlign = 'left'; ctx.font = '20px system-ui';
  let x = 16;
  for (const k of Object.keys(UPGRADES)) {
    if (player.lv[k]) { ctx.fillText(UPGRADES[k].icon, x, H - 20); ctx.font = '600 11px system-ui'; ctx.fillText(player.lv[k], x + 22, H - 16); ctx.font = '20px system-ui'; x += 42; }
  }
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function start() { newGame(); setState('play'); }
document.getElementById('startBtn').onclick = start;
document.getElementById('retryBtn').onclick = start;
document.getElementById('resumeBtn').onclick = () => setState('play');
try {
  const b = +localStorage.getItem('survivor-best');
  if (b) document.getElementById('best').textContent = `🏆 Record : ${fmtTime(b)}`;
} catch {}
</script>
</body>
