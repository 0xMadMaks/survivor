<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survivor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d14; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }
  canvas { display: block; }
  .px { font-family: 'Press Start 2P', monospace; }
  .overlay { position: fixed; inset: 0; display: none; flex-direction: column; overflow-y: auto; background: radial-gradient(ellipse at center, rgba(8,10,20,.55), rgba(4,5,10,.9)); z-index: 10; text-align: center; }
  .overlay.show { display: flex; }
  .panel { margin: auto; padding: 28px 16px; display: flex; flex-direction: column; align-items: center; }
  h1 { font-family: 'Press Start 2P', monospace; font-size: 54px; margin: 0 0 18px; color: #ffcc4d; text-shadow: 4px 4px 0 #b34700, 0 0 30px #ff8a0088; }
  h2 { font-family: 'Press Start 2P', monospace; font-size: 24px; margin: 0 0 24px; color: #ffcc4d; text-shadow: 3px 3px 0 #b34700; }
  h3 { font-family: 'Press Start 2P', monospace; font-size: 12px; margin: 30px 0 12px; color: #c3c8e0; }
  p { color: #c3c8e0; margin: 6px 0; line-height: 1.5; }
  button { font: inherit; }
  .btn { margin-top: 24px; padding: 16px 34px; font-family: 'Press Start 2P', monospace; font-size: 16px; border: 0; border-radius: 4px; background: #ffcc4d; color: #2a1600; cursor: pointer; box-shadow: 0 6px 0 #b36b00; transition: transform .08s, box-shadow .08s; }
  .btn:hover { background: #ffd970; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b36b00; }
  .btn.alt { background: #3a4262; color: #fff; box-shadow: 0 6px 0 #1c2133; margin-left: 12px; }
  .cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .card { width: 220px; padding: 18px; border-radius: 6px; background: linear-gradient(#22283d, #171b2b); border: 3px solid #3a4262; box-shadow: 0 6px 0 #0c0e18; cursor: pointer; text-align: left; color: #fff; transition: transform .1s, border-color .1s; }
  .card:hover { transform: translateY(-6px); border-color: #ffcc4d; }
  .card .icon { font-size: 34px; }
  .card .name { font-size: 17px; font-weight: 700; margin: 10px 0 6px; }
  .card .lvl { font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ffcc4d; }
  .card .lvl.new { color: #5be37d; }
  .card .tag { font-family: 'Press Start 2P', monospace; font-size: 8px; color: #8a91b3; margin-left: 6px; }
  .card .desc { font-size: 14px; color: #b8bdd6; margin-top: 8px; }
  .card .key { float: right; font-family: 'Press Start 2P', monospace; font-size: 10px; color: #6c7393; }
  .chars { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
  .char { width: 150px; padding: 14px 10px; border-radius: 6px; background: linear-gradient(#22283d, #171b2b); border: 3px solid #3a4262; cursor: pointer; color: #fff; transition: transform .1s, border-color .1s; }
  .char:hover { transform: translateY(-4px); }
  .char.sel { border-color: #ffcc4d; box-shadow: 0 0 18px #ffcc4d55; }
  .char img { height: 64px; image-rendering: pixelated; }
  .char .name { font-family: 'Press Start 2P', monospace; font-size: 10px; margin: 10px 0 6px; color: #ffcc4d; }
  .char .desc { font-size: 12px; color: #b8bdd6; line-height: 1.35; }
  .rank { border-collapse: collapse; font-size: 14px; min-width: 460px; }
  .rank th { font-family: 'Press Start 2P', monospace; font-size: 8px; color: #8a91b3; padding: 6px 10px; text-align: left; }
  .rank td { padding: 6px 10px; border-top: 1px solid #262b40; text-align: left; color: #d4d8ea; }
  .rank tr.me td { background: #ffcc4d22; color: #ffcc4d; font-weight: 700; }
  .rank td.pos { font-family: 'Press Start 2P', monospace; font-size: 10px; }
  .rewards { display: flex; flex-direction: column; gap: 10px; min-width: 340px; }
  .reward { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 6px; background: #1a1e2e; border: 2px solid #343a55; opacity: 0; transform: scale(.8); animation: pop .35s forwards; text-align: left; }
  .reward .icon { font-size: 28px; }
  .reward .name { font-weight: 700; }
  .reward .lvl { font-family: 'Press Start 2P', monospace; font-size: 8px; color: #ffcc4d; margin-top: 4px; }
  .reward.evo { border-color: #ffcc4d; background: linear-gradient(90deg, #4a3500, #1a1e2e); box-shadow: 0 0 24px #ffcc4d66; }
  .reward.evo .lvl { color: #fff2a8; }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }
  kbd { background: #262b40; border-bottom: 2px solid #11131e; border-radius: 4px; padding: 2px 7px; font-size: 13px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="overlay show"><div class="panel">
  <h1>SURVIVOR</h1>
  <p>Survis aux vagues le plus longtemps possible. Tes armes tirent toutes seules.</p>
  <p>Déplacement : <kbd>ZQSD</kbd> / <kbd>WASD</kbd> / <kbd>flèches</kbd> &nbsp;·&nbsp; Pause : <kbd>Échap</kbd></p>
  <h3>CHOISIS TON HEROS</h3>
  <div class="chars" id="chars"></div>
  <button class="btn" id="startBtn">JOUER</button>
  <h3>🏆 MEILLEURES PARTIES</h3>
  <div id="menuRank"></div>
</div></div>

<div id="levelup" class="overlay"><div class="panel">
  <h2>NIVEAU SUPERIEUR !</h2>
  <div class="cards" id="cards"></div>
  <p style="margin-top:22px">Choisis une amélioration (clic ou <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>)</p>
</div></div>

<div id="chest" class="overlay"><div class="panel">
  <h2 id="chestTitle"></h2>
  <div class="rewards" id="chestRewards"></div>
  <button class="btn" id="chestBtn">CONTINUER</button>
</div></div>

<div id="pause" class="overlay"><div class="panel">
  <h2>PAUSE</h2>
  <div><button class="btn" id="resumeBtn">REPRENDRE</button><button class="btn alt" id="quitBtn">ABANDONNER</button></div>
</div></div>

<div id="gameover" class="overlay"><div class="panel">
  <h1>GAME OVER</h1>
  <p id="stats"></p>
  <h3>🏆 MEILLEURES PARTIES</h3>
  <div id="overRank"></div>
  <div><button class="btn" id="retryBtn">REJOUER</button><button class="btn alt" id="menuBtn">MENU</button></div>
</div></div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const PX_FONT = '"Press Start 2P", monospace';
let W, H, vignette;
function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  ctx.imageSmoothingEnabled = false; // resizing resets context state
  vignette = document.createElement('canvas');
  vignette.width = W; vignette.height = H;
  const v = vignette.getContext('2d');
  const grad = v.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) / 2);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.6)');
  v.fillStyle = grad; v.fillRect(0, 0, W, H);
}
addEventListener('resize', resize);
resize();

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Escape' && state === 'play') setState('pause');
  else if (e.key === 'Escape' && state === 'pause') setState('play');
  if (state === 'levelup' && ['1', '2', '3'].includes(e.key)) pickUpgrade(+e.key - 1);
  if (state === 'chest' && (e.key === 'Enter' || e.key === ' ')) closeChest();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') setState('pause'); });

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const fmtTime = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
function hash(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// ---------- Pixel-art sprites ----------
// Each sprite is a grid of palette characters ('.' = transparent), rendered once with a dark outline.
function makeSprite(rows, pal, px) {
  const w = rows[0].length + 2, h = rows.length + 2;
  const mk = () => { const c = document.createElement('canvas'); c.width = w * px; c.height = h * px; return c; };
  const img = mk(), white = mk();
  const g = img.getContext('2d'), wg = white.getContext('2d');
  const solid = (x, y) => rows[y]?.[x] && rows[y][x] !== '.';
  g.fillStyle = wg.fillStyle = '#0a0a12';
  for (let y = -1; y <= rows.length; y++) for (let x = -1; x <= rows[0].length; x++) {
    if (!solid(x, y) && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1))) {
      g.fillRect((x + 1) * px, (y + 1) * px, px, px);
    }
  }
  wg.fillStyle = '#fff';
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    g.fillStyle = pal[ch];
    g.fillRect((x + 1) * px, (y + 1) * px, px, px);
    wg.fillRect((x + 1) * px, (y + 1) * px, px, px);
  }));
  return { img, white, w: img.width, h: img.height };
}
// Two walking frames from a body and two leg rows
const walkFrames = (body, legsA, legsB, pal, px) => [makeSprite([...body, legsA], pal, px), makeSprite([...body, legsB], pal, px)];

const robedBody = [

  '.rRrrrrrrRr.w',
  '..rrrrrrrr..w',
];
const robedLegs = ['..ff....ff..w', '...ff..ff...w'];
const robed = pal => walkFrames(robedBody, ...robedLegs, { k: '#f2c79b', e: '#1a1300', f: '#4a3020', w: '#8a5a2b', ...pal }, 3);

const knightBody = [

  '...HhhhhH...s',
  '...HvvvvH...s',

  '.AaaaRRaaaA..',
  '..aaaaaaaa...',

];
const rangerBody = [

  '...GggggG...b',
  '..GgkkkkgG.sb',
  '..GkekkekG.sb',
  '..GkkkkkkG.sb',
  '...GddddG..sb',
  '..dddLLddd.sb',
  '.ddddLLdddd.b',
  '.kddddddddk.b',
  '..dddddddd...',
];

const SPR = {
  chars: {
    mage: robed({ h: '#4a6cf7', H: '#2f47b8', s: '#ffe14d', b: '#e8e8f0', r: '#6a4be0', R: '#3d2a99', S: '#7ff0ff' }),
    knight: walkFrames(knightBody, '..AA....AA...', '...AA..AA....',
      { H: '#6b7385', h: '#c3cad8', v: '#1a1d26', A: '#4a5266', a: '#9aa3b6', R: '#c4203f', s: '#e6ecf5', g: '#c9a24a' }, 3),

      { G: '#2e6b3a', g: '#3f8f4e', k: '#f2c79b', e: '#1a1300', d: '#4f7d3a', L: '#8a5a2b', s: '#e8e8e8', b: '#a06a32', n: '#5a3a22' }, 3),
    pyro: robed({ h: '#d8402a', H: '#8f2414', s: '#ffcc4d', b: '#9a9a9a', r: '#a8321f', R: '#6b1c10', S: '#ff9a3c' }),
    monk: robed({ h: '#f0d040', H: '#a88a10', s: '#4dd2ff', b: '#e8e8f0', r: '#dcdce8', R: '#8a90a8', S: '#fff27a' }),
  },
  grunt: [makeSprite([
    '....gggg....',
    '..gggggggg..',
    '.gglggggggg.',
    '.glgggggggg.',
    'ggweggggwegg',
    'gggggggggggg',
    'gggggeeggggg',
    'gggggggggggg',
    'GggggggggggG',
    '.GGGGGGGGGG.',
  ], { g: '#e0485a', G: '#a3283a', l: '#ff9aa5', e: '#1a0d10', w: '#fff' }, 2)],
  bat: [
    makeSprite([
      'B............B',
      'BB..........BB',
      'BbB..b..b..BbB',
      'BbbB.bbbb.BbbB',
      '.BbbbebbebbbB.',
      '..BBbbbbbbBB..',
      '....btbbtb....',
      '.....bbbb.....',
    ], { b: '#b06cff', B: '#6f38c9', e: '#ffe14d', t: '#fff' }, 2),
    makeSprite([
      '..............',
      '.....b..b.....',
      '....bbbbbb....',
      '..BbbebbebbB..',
      '.BbbbbbbbbbbB.',
      'BbB.btbbtb.BbB',
      'BB...bbbb...BB',
      'B............B',
    ], { b: '#b06cff', B: '#6f38c9', e: '#ffe14d', t: '#fff' }, 2),
  ],
  brute: [makeSprite([
    '....OOOOOO....',
    '...OooooooO...',
    '..OooooooooO..',
    '..OoeooooeoO..',
    '..OooooooooO..',
    '..OocooooocO..',
    '.OOOooooooOOO.',
    'OooOOOOOOOOooO',
    'OooOaAAAAaOooO',
    'OooOOOOOOOOooO',
    '.OO.OOOOOO.OO.',
    '....OOOOOO....',
    '....OO..OO....',
    '...OOO..OOO...',
  ], { o: '#8a93a6', O: '#555d70', e: '#ff9a3c', c: '#3a404f', a: '#5a4630', A: '#c9a24a' }, 3)],
  boss: [makeSprite([
    'h..............h',
    'hh............hh',
    '.hh..DDDDDD..hh.',
    '..hDDddddddDDh..',
    '...DddddddddD...',
    '..DddddddddddD..',
    '..DdeeddddeedD..',
    '..DddeddddeddD..',
    '..DddddddddddD..',
    '..DdmmmmmmmmdD..',
    '..DdmwmwwmwmdD..',
    '...DdmmmmmmdD...',
    '..DDDddddddDDD..',
    '.DddD.DDDD.DddD.',
    '.DD....DD....DD.',
  ], { d: '#ff8a00', D: '#b35a00', h: '#f0e6c0', e: '#fff200', m: '#3a0a00', w: '#fff' }, 6)],
  gem: makeSprite(['..c..', '.wcC.', 'wccCC', '.cCC.', '..C..'], { c: '#4dd2ff', C: '#1a8fd6', w: '#fff' }, 3),
  bigGem: makeSprite(['..c..', '.wcC.', 'wccCC', '.cCC.', '..C..'], { c: '#ff5ec4', C: '#c42b8e', w: '#fff' }, 3),
  heart: makeSprite(['.rr.rr.', 'rwrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'], { r: '#ff4d6d', w: '#fff' }, 2),
  dagger: makeSprite(['g.......', 'ggsssssw', 'g.......'], { g: '#c9a24a', s: '#c3cad8', w: '#fff' }, 2),
};

const CHEST_ROWS = [
  '..OOOOOOOO..',
  '.OccccccccO.',
  'OccccccccccO',
  'OOOOOggOOOOO',
  'OccccgkgcccO',
  'OcccccgccccO',
  'OccccccccccO',
  'OOOOOOOOOOOO',
];
const CHESTS = {
  bronze: { name: 'COFFRE EN BRONZE', rewards: 1, glow: 'rgba(224,160,80,0.5)',  spr: makeSprite(CHEST_ROWS, { c: '#a0603a', O: '#5a3018', g: '#e0a050', k: '#1a1300' }, 3) },
  silver: { name: 'COFFRE EN ARGENT', rewards: 3, glow: 'rgba(200,220,255,0.55)', spr: makeSprite(CHEST_ROWS, { c: '#9aa6bd', O: '#4a5268', g: '#e8eef8', k: '#1a1300' }, 3) },
  gold:   { name: 'COFFRE EN OR !',   rewards: 5, glow: 'rgba(255,204,77,0.7)',   spr: makeSprite(CHEST_ROWS, { c: '#ffcc4d', O: '#b36b00', g: '#fff2a8', k: '#1a1300' }, 3) },
};

// Ground decorations, pre-rendered once
const DECO = {
  grass: makeSprite(['.g...g.', '.g.g.g.', 'gg.g.gg', '.ggggg.'], { g: '#2f5a3a' }, 3),
  grass2: makeSprite(['..g..', 'g.g.g', '.ggg.'], { g: '#3a6b45' }, 3),
  stone: makeSprite(['.sss.', 'sllss', 'sssSS', '.SSS.'], { s: '#4a5160', l: '#6b7385', S: '#363b47' }, 3),
  flower: makeSprite(['.y.', 'yoy', '.y.'], { y: '#9c8a3c', o: '#a0542c' }, 3),
  flower2: makeSprite(['.p.', 'pwp', '.p.'], { p: '#6f5596', w: '#a9a3b8' }, 3),
  skull: makeSprite(['.bbb.', 'bebeb', 'bbbbb', '.b.b.'], { b: '#c9c2a8', e: '#20242e' }, 2),
};

// Soft shadow and additive glow sprites
const shadowSpr = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 20;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.38)';
  g.beginPath(); g.ellipse(32, 10, 30, 9, 0, 0, Math.PI * 2); g.fill();
  return c;
})();
const glowCache = {};
function glow(color, r) {
  const key = color + r;
  if (!glowCache[key]) {
    const c = document.createElement('canvas'); c.width = c.height = r * 2;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, color); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(0, 0, r * 2, r * 2);
    glowCache[key] = c;
  }
  return glowCache[key];
}

function drawSprite(spr, x, y, { flip = false, sx = 1, sy = 1, white = false, rot = 0 } = {}) {
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.scale(flip ? -sx : sx, sy);
  ctx.drawImage(white ? spr.white : spr.img, -spr.w / 2, -spr.h / 2);
  ctx.restore();
}

// ---------- Characters ----------
const CHARACTERS = {
  mage:   { name: 'Mage', weapon: 'bolt', hp: 100, speed: 190, desc: 'Projectile magique. Équilibré.', tip: 'rgba(127,240,255,0.7)' },
  knight: { name: 'Chevalier', weapon: 'orbit', hp: 150, speed: 170, armor: 3, desc: 'Lames orbitales. +50 PV et armure, mais plus lent.' },

  pyro:   { name: 'Pyromancien', weapon: 'meteor', hp: 100, speed: 185, dmg: 1.15, desc: 'Météores. +15% de dégâts.', tip: 'rgba(255,154,60,0.8)' },

};
let selectedChar = 'mage';
try { if (CHARACTERS[localStorage.getItem('survivor-char')]) selectedChar = localStorage.getItem('survivor-char'); } catch {}

// ---------- Upgrades ----------
const UPGRADES = {
  bolt:      { type: 'weapon', icon: '✨', name: 'Projectile magique', max: 6, desc: l => l === 0 ? 'Tire sur l\'ennemi le plus proche.' : '+1 projectile, +dégâts' },
  daggers:   { type: 'weapon', icon: '🗡️', name: 'Dagues', max: 6, desc: l => l === 0 ? 'Lance des dagues droit devant toi, très vite.' : '+1 dague, +dégâts' },
  orbit:     { type: 'weapon', icon: '🌀', name: 'Lames orbitales', max: 6, desc: l => l === 0 ? 'Des lames tournent autour de toi.' : '+1 lame, +dégâts' },
  boomerang: { type: 'weapon', icon: '🪃', name: 'Boomerang', max: 6, desc: l => l === 0 ? 'Part, transperce, et revient.' : '+dégâts, +1 boomerang tous les 2 niveaux' },
  aura:      { type: 'weapon', icon: '🔥', name: 'Aura brûlante', max: 6, desc: l => l === 0 ? 'Brûle les ennemis proches.' : '+rayon, +dégâts' },
  lightning: { type: 'weapon', icon: '⚡', name: 'Foudre', max: 6, desc: l => l === 0 ? 'Frappe des ennemis au hasard.' : '+1 éclair, +dégâts' },
  meteor:    { type: 'weapon', icon: '☄️', name: 'Météores', max: 6, desc: l => l === 0 ? 'Fait pleuvoir des météores sur les groupes.' : '+dégâts, +zone, plus de météores' },
  nova:      { type: 'weapon', icon: '💥', name: 'Onde de choc', max: 5, desc: l => l === 0 ? 'Explosion périodique qui repousse.' : '+dégâts, plus fréquente' },
  power:     { type: 'passive', icon: '💪', name: 'Puissance', max: 5, desc: () => '+10% de dégâts' },
  rate:      { type: 'passive', icon: '⏱️', name: 'Frénésie', max: 5, desc: () => '-8% temps de recharge des armes' },
  speed:     { type: 'passive', icon: '👟', name: 'Bottes', max: 5, desc: () => '+10% vitesse de déplacement' },
  hp:        { type: 'passive', icon: '❤️', name: 'Vitalité', max: 5, desc: () => '+25 PV max et soin complet' },
  armor:     { type: 'passive', icon: '🛡️', name: 'Armure', max: 5, desc: () => '-1 dégât subi par coup' },
  magnet:    { type: 'passive', icon: '🧲', name: 'Aimant', max: 4, desc: () => '+50% rayon de ramassage' },
  regen:     { type: 'passive', icon: '🌿', name: 'Régénération', max: 4, desc: () => '+0.6 PV par seconde' },
};
// Evolutions: a max-level weapon + its passive, found only in silver/gold chests. Doubles damage, faster, more projectiles.
const EVOLUTIONS = {
  bolt:      { needs: 'rate',   icon: '🌟', name: 'Déluge arcanique' },
  daggers:   { needs: 'power',  icon: '⚔️', name: 'Mille lames' },
  orbit:     { needs: 'magnet', icon: '🌌', name: 'Galaxie' },
  boomerang: { needs: 'armor',  icon: '🪓', name: 'Hache du titan' },
  aura:      { needs: 'regen',  icon: '☀️', name: 'Soleil intérieur' },
  lightning: { needs: 'speed',  icon: '🌩️', name: 'Tempête' },
  meteor:    { needs: 'power',  icon: '🌠', name: 'Apocalypse' },
  nova:      { needs: 'hp',     icon: '🌋', name: 'Cataclysme' },
};

// ---------- Game state ----------
let state = 'menu';
let player, enemies, bullets, booms, meteors, strikes, gems, chests, particles, texts, novas, rings;
let time, kills, spawnTimer, shake, choices, bossTimer, lastRunId = null;

function newGame() {
  const c = CHARACTERS[selectedChar];
  const lv = Object.fromEntries(Object.keys(UPGRADES).map(k => [k, 0]));
  lv[c.weapon] = 1;
  player = {
    char: selectedChar, x: 0, y: 0, r: 14, speed: c.speed, hp: c.hp, maxHp: c.hp, regen: 0, armor: c.armor || 0,
    dmgMul: c.dmg || 1, cdMul: c.cd || 1, magnet: 90 * (c.magnet || 1),
    level: 1, xp: 0, xpNext: 5, invuln: 0, lv, evo: {},
    cd: { bolt: 0, daggers: 0, boomerang: 0, lightning: 0, meteor: 0, nova: 0 },
    orbitAngle: 0, auraTick: 0, facing: 1, dir: { x: 1, y: 0 }, moving: false, walk: 0,
  };
  enemies = []; bullets = []; booms = []; meteors = []; strikes = []; gems = []; chests = [];
  particles = []; texts = []; novas = []; rings = [];
  time = 0; kills = 0; spawnTimer = 0; shake = 0; bossTimer = 60;
}

function setState(s) {
  state = s;
  for (const id of ['menu', 'levelup', 'chest', 'pause', 'gameover']) document.getElementById(id).classList.toggle('show', id === s);
  last = performance.now();
}

// ---------- Enemies ----------
const ENEMY_TYPES = {
  grunt: { r: 12, hp: 12, speed: 75, dmg: 8,  xp: 1, color: '#e0485a' },
  bat:   { r: 9,  hp: 7,  speed: 135, dmg: 6, xp: 1, color: '#b06cff' },
  brute: { r: 22, hp: 70, speed: 50, dmg: 18, xp: 5, color: '#8a93a6' },
  boss:  { r: 42, hp: 900, speed: 62, dmg: 30, xp: 40, color: '#ff8a00' },
};

function spawnEnemy(type) {
  const t = ENEMY_TYPES[type];
  const a = rand(0, Math.PI * 2);
  const d = Math.hypot(W, H) / 2 + 60;
  const scale = 1 + time / 90; // enemies get tougher over time
  enemies.push({
    type, x: player.x + Math.cos(a) * d, y: player.y + Math.sin(a) * d,
    r: t.r, hp: t.hp * scale, maxHp: t.hp * scale, speed: t.speed * rand(0.9, 1.1),
    dmg: t.dmg, xp: t.xp, color: t.color, hit: 0, kx: 0, ky: 0, phase: rand(0, Math.PI * 2),
  });
}

function spawnWave(dt) {
  spawnTimer -= dt;
  const interval = Math.max(0.08, 0.9 - time / 120);
  while (spawnTimer <= 0) {
    spawnTimer += interval;
    if (enemies.length >= 450) continue; // cap to keep the frame rate smooth
    const roll = Math.random();
    if (time > 90 && roll < 0.08) spawnEnemy('brute');
    else if (time > 30 && roll < 0.35) spawnEnemy('bat');
    else spawnEnemy('grunt');
  }
  bossTimer -= dt;
  if (bossTimer <= 0) {
    bossTimer = 60;
    spawnEnemy('boss');
    floatText(player.x, player.y - 60, 'UN BOSS ARRIVE !', '#ff8a00', 16);
  }
}

function damageEnemy(e, dmg, kx = 0, ky = 0) {
  dmg *= player.dmgMul;
  e.hp -= dmg;
  e.hit = 0.1;
  e.kx += kx; e.ky += ky;
  if (texts.length < 120) floatText(e.x + rand(-6, 6), e.y - e.r, Math.round(dmg), '#fff', 10);
}

function killEnemy(e) {
  kills++;
  gems.push({ x: e.x, y: e.y, v: e.xp, r: e.xp >= 5 ? 7 : 4, phase: rand(0, 6) });
  if (e.type === 'boss' || Math.random() < 0.012) gems.push({ x: e.x + 10, y: e.y, heal: true, r: 7, phase: 0 });
  if (e.type === 'boss') chests.push({ x: e.x, y: e.y, kind: Math.random() < 0.4 ? 'gold' : 'silver' });
  else if (e.type === 'brute' && Math.random() < 0.06) chests.push({ x: e.x, y: e.y, kind: 'bronze' });
  burst(e.x, e.y, e.color, e.type === 'boss' ? 50 : 10);
  rings.push({ x: e.x, y: e.y, r: e.r * 0.5, max: e.r * 2.2, life: 0.25, max_life: 0.25, color: e.color });
  if (e.type === 'boss') shake = 18;
}

// ---------- Effects ----------
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(40, 240);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), max: 0.7, color, r: rand(2, 5) | 0 });
  }
}
function floatText(x, y, txt, color, size) { texts.push({ x, y, txt, color, size, life: 0.8 }); }

// ---------- Weapons ----------
function nearestEnemy(range) {
  let best = null, bd = range * range;
  for (const e of enemies) { const d = dist2(e, player); if (d < bd) { bd = d; best = e; } }
  return best;
}
const isEvo = k => player.evo[k] ? 1 : 0;
// Ticks a weapon's cooldown; returns true when it is ready to fire (caller resets via fire())
function ready(k, dt) { player.cd[k] -= dt; return player.lv[k] > 0 && player.cd[k] <= 0; }
function fire(k, base) { player.cd[k] = base * player.cdMul * (isEvo(k) ? 0.6 : 1); }

function updateWeapons(dt) {
  const L = player.lv;

  // Magic bolt: aimed at the nearest enemy
  if (ready('bolt', dt)) {
    const target = nearestEnemy(600);
    if (target) {
      fire('bolt', 0.8);
      const count = L.bolt + isEvo('bolt') * 3;
      const base = Math.atan2(target.y - player.y, target.x - player.x);
      for (let i = 0; i < count; i++) {
        const a = base + (i - (count - 1) / 2) * 0.16;
        bullets.push({ kind: 'bolt', x: player.x, y: player.y - 6, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, r: 5, dmg: (8 + L.bolt * 4) * (1 + isEvo('bolt')), life: 1.2, pierce: 1 + Math.floor(L.bolt / 3) + isEvo('bolt') * 2 });
      }
    }
  }

  // Daggers: fast volley at the nearest close enemy, otherwise in the movement direction
  if (ready('daggers', dt)) {
    fire('daggers', 0.5);
    const count = L.daggers + isEvo('daggers') * 3;
    const close = nearestEnemy(380);
    let { x: dx, y: dy } = player.dir;
    if (close) { const d = Math.sqrt(dist2(close, player)) || 1; dx = (close.x - player.x) / d; dy = (close.y - player.y) / d; }
    for (let i = 0; i < count; i++) {
      const off = (i - (count - 1) / 2) * 10, a = Math.atan2(dy, dx) + rand(-0.05, 0.05);
      bullets.push({ kind: 'dagger', x: player.x - dy * off, y: player.y + dx * off, vx: Math.cos(a) * 680, vy: Math.sin(a) * 680, r: 5, dmg: (6 + L.daggers * 3) * (1 + isEvo('daggers')), life: 0.8, pierce: 1 + (L.daggers >= 4 ? 1 : 0) + isEvo('daggers') });
    }
  }

  // Boomerang: flies out, slows down, comes back
  if (ready('boomerang', dt)) {
    fire('boomerang', 1.5);
    const target = nearestEnemy(500);
    const base = target ? Math.atan2(target.y - player.y, target.x - player.x) : Math.atan2(player.dir.y, player.dir.x);
    const count = Math.ceil(L.boomerang / 2) + isEvo('boomerang');
    for (let i = 0; i < count; i++) {
      const a = base + i * Math.PI * 2 / count;
      booms.push({ x: player.x, y: player.y, vx: Math.cos(a) * 480, vy: Math.sin(a) * 480, t: 0, dmg: (12 + L.boomerang * 5) * (1 + isEvo('boomerang')), size: 1 + isEvo('boomerang') * 0.6, hits: new Map() });
    }
  }
  for (const b of booms) {
    b.t += dt;
    if (b.t < 0.5) { b.vx *= 1 - 2.5 * dt; b.vy *= 1 - 2.5 * dt; }
    else {
      const d = Math.sqrt(dist2(b, player)) || 1, s = Math.min(650, 200 + (b.t - 0.5) * 900);
      b.vx = (player.x - b.x) / d * s; b.vy = (player.y - b.y) / d * s;
      if (d < 20) b.done = true;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.t > 4) b.done = true;
    for (const e of enemies) {
      if (dist2(b, e) < (e.r + 14 * b.size) ** 2 && (b.hits.get(e) ?? 0) < time) {
        damageEnemy(e, b.dmg, b.vx * 0.2, b.vy * 0.2);
        b.hits.set(e, time + 0.3);
      }
    }
  }
  booms = booms.filter(b => !b.done);

  // Orbiting blades
  if (L.orbit) {
    player.orbitAngle += dt * (2.6 + L.orbit * 0.2);
    const n = L.orbit + 1 + isEvo('orbit') * 2, R = orbitRadius(), dmg = (6 + L.orbit * 3) * (1 + isEvo('orbit'));
    for (let i = 0; i < n; i++) {
      const a = player.orbitAngle + i * Math.PI * 2 / n;
      const bx = player.x + Math.cos(a) * R, by = player.y + Math.sin(a) * R;
      for (const e of enemies) {
        if ((e.x - bx) ** 2 + (e.y - by) ** 2 < (e.r + 10) ** 2 && (e.orbitHit ?? 0) <= 0) {
          damageEnemy(e, dmg, Math.cos(a) * 120, Math.sin(a) * 120);
          e.orbitHit = 0.35;
        }
      }
    }
  }

  // Burning aura
  if (L.aura) {
    const R = auraRadius();
    player.auraTick -= dt;
    if (player.auraTick <= 0) {
      player.auraTick = 0.4;
      for (const e of enemies) if (dist2(e, player) < (R + e.r) ** 2) damageEnemy(e, (3 + L.aura * 2) * (1 + isEvo('aura')));
    }
    // Rising embers along the aura
    if (Math.random() < dt * 30) {
      const a = rand(0, Math.PI * 2), d = R * rand(0.5, 1);
      particles.push({ x: player.x + Math.cos(a) * d, y: player.y + Math.sin(a) * d, vx: rand(-15, 15), vy: rand(-90, -50), life: rand(0.4, 0.8), max: 0.8, color: Math.random() < 0.5 ? '#ffb347' : '#ff6a2a', r: 3, glow: true });
    }
  }

  // Lightning: strikes random enemies in range
  if (ready('lightning', dt)) {
    const inRange = enemies.filter(e => dist2(e, player) < 450 ** 2);
    if (inRange.length) {
      fire('lightning', 1.6);
      const n = L.lightning + isEvo('lightning') * 3;
      for (let i = 0; i < n; i++) {
        const e = pick(inRange);
        damageEnemy(e, (14 + L.lightning * 7) * (1 + isEvo('lightning')));
        // Pre-compute a jagged path from the sky down to the target
        const pts = [], top = e.y - 420, sx = e.x + rand(-60, 60);
        for (let k = 0; k <= 8; k++) pts.push({ x: sx + (e.x - sx) * k / 8 + (k && k < 8 ? rand(-14, 14) : 0), y: top + (e.y - top) * k / 8 });
        strikes.push({ pts, x: e.x, y: e.y, life: 0.18 });
        burst(e.x, e.y, '#bfe8ff', 5);
      }
    }
  }
  for (const s of strikes) s.life -= dt;
  strikes = strikes.filter(s => s.life > 0);

  // Meteors: fall on enemies after a short warning
  if (ready('meteor', dt)) {
    fire('meteor', 2.6);
    const near = enemies.filter(e => dist2(e, player) < 380 ** 2);
    const n = Math.ceil(L.meteor / 2) + isEvo('meteor') * 2;
    for (let i = 0; i < n; i++) {
      const tgt = near.length ? pick(near) : { x: player.x + rand(-250, 250), y: player.y + rand(-200, 200) };
      meteors.push({ x: tgt.x, y: tgt.y, t: 0.7, R: (55 + L.meteor * 7) * (1 + isEvo('meteor') * 0.4), dmg: (25 + L.meteor * 10) * (1 + isEvo('meteor')) });
    }
  }
  for (const m of meteors) {
    m.t -= dt;
    if (m.t <= 0) {
      m.done = true;
      for (const e of enemies) {
        const d = Math.sqrt(dist2(e, m));
        if (d < m.R + e.r) damageEnemy(e, m.dmg, (e.x - m.x) / (d || 1) * 250, (e.y - m.y) / (d || 1) * 250);
      }
      burst(m.x, m.y, '#ff8a3c', 22);
      burst(m.x, m.y, '#ffd84d', 10);
      rings.push({ x: m.x, y: m.y, r: 10, max: m.R, life: 0.3, max_life: 0.3, color: '#ffb347' });
      shake = Math.max(shake, 5);
    }
  }
  meteors = meteors.filter(m => !m.done);

  // Shockwave
  if (ready('nova', dt)) {
    fire('nova', 5 - L.nova * 0.6);
    const R = 200 * (1 + isEvo('nova') * 0.5);
    novas.push({ x: player.x, y: player.y, r: 0, max: R, life: 0.4 });
    for (const e of enemies) {
      const d = Math.sqrt(dist2(e, player));
      if (d < R) {
        const nx = (e.x - player.x) / (d || 1), ny = (e.y - player.y) / (d || 1);
        damageEnemy(e, (20 + L.nova * 12) * (1 + isEvo('nova')), nx * 500, ny * 500);
      }
    }
    shake = Math.max(shake, 6);
  }
}
const orbitRadius = () => (70 + player.lv.orbit * 4) * (1 + isEvo('orbit') * 0.3);
const auraRadius = () => (60 + player.lv.aura * 14) * (1 + isEvo('aura') * 0.4);

// ---------- Level up & chests ----------
function gainXp(v) {
  player.xp += v;
  // While a choice screen is open, keep the XP; closing it chains the next level-up
  if (state !== 'play') return;
  if (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.floor(5 + player.level * 4 + player.level ** 1.5);
    openLevelUp();
  }
}

const upgradePool = () => Object.keys(UPGRADES).filter(k => player.lv[k] < UPGRADES[k].max);

function applyUpgrade(k) {
  player.lv[k]++;
  if (k === 'speed') player.speed *= 1.1;
  if (k === 'hp') { player.maxHp += 25; player.hp = player.maxHp; }
  if (k === 'magnet') player.magnet *= 1.5;
  if (k === 'rate') player.cdMul *= 0.92;
  if (k === 'regen') player.regen += 0.6;
  if (k === 'armor') player.armor += 1;
  if (k === 'power') player.dmgMul *= 1.1;
}

function openLevelUp() {
  choices = upgradePool().sort(() => Math.random() - 0.5).slice(0, 3);
  if (!choices.length) { player.hp = player.maxHp; return; }
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  choices.forEach((k, i) => {
    const u = UPGRADES[k], l = player.lv[k];
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = `<span class="key">${i + 1}</span><div class="icon">${u.icon}</div><div class="name">${u.name}</div>
      <div class="lvl ${l === 0 ? 'new' : ''}">${l === 0 ? 'NOUVEAU' : 'NIVEAU ' + (l + 1)}<span class="tag">${u.type === 'weapon' ? 'ARME' : 'PASSIF'}</span></div>
      <div class="desc">${u.desc(l)}</div>`;
    b.onclick = () => pickUpgrade(i);
    cards.appendChild(b);
  });
  setState('levelup');
}

function pickUpgrade(i) {
  const k = choices?.[i];
  if (!k) return;
  applyUpgrade(k);
  choices = null;
  resume();
}

// Back to the action, then process any XP that piled up while a menu was open
function resume() {
  setState('play');
  if (player.xp >= player.xpNext) gainXp(0);
}

function openChest(kind) {
  const chest = CHESTS[kind];
  const rewards = [];
  // Silver and gold chests evolve an eligible weapon first
  if (kind !== 'bronze') {
    const evo = Object.keys(EVOLUTIONS).find(k => !player.evo[k] && player.lv[k] >= UPGRADES[k].max && player.lv[EVOLUTIONS[k].needs] > 0);
    if (evo) { player.evo[evo] = true; rewards.push({ evo, icon: EVOLUTIONS[evo].icon, name: EVOLUTIONS[evo].name, sub: `EVOLUTION DE ${UPGRADES[evo].name.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase()}` }); }
  }
  while (rewards.length < chest.rewards) {
    const pool = upgradePool();
    if (!pool.length) break;
    // Favour what the player already owns, so chests deepen the build
    const owned = pool.filter(k => player.lv[k] > 0);
    const k = owned.length && Math.random() < 0.7 ? pick(owned) : pick(pool);
    applyUpgrade(k);
    rewards.push({ icon: UPGRADES[k].icon, name: UPGRADES[k].name, sub: `NIVEAU ${player.lv[k]}` });
  }
  player.hp = Math.min(player.maxHp, player.hp + 20 * chest.rewards);
  rewards.push({ icon: '❤️', name: `+${20 * chest.rewards} PV`, sub: 'SOIN' });

  document.getElementById('chestTitle').textContent = chest.name;
  document.getElementById('chestRewards').innerHTML = rewards.map((r, i) =>
    `<div class="reward ${r.evo ? 'evo' : ''}" style="animation-delay:${i * 0.22}s"><div class="icon">${r.icon}</div><div><div class="name">${r.name}</div><div class="lvl">${r.sub}</div></div></div>`).join('');
  setState('chest');
}
function closeChest() { if (state === 'chest') resume(); }

// ---------- Update ----------
function update(dt) {
  time += dt;

  // Movement
  let dx = 0, dy = 0;
  if (keys['z'] || keys['w'] || keys['arrowup']) dy--;
  if (keys['s'] || keys['arrowdown']) dy++;
  if (keys['q'] || keys['a'] || keys['arrowleft']) dx--;
  if (keys['d'] || keys['arrowright']) dx++;
  player.moving = !!(dx || dy);
  if (player.moving) {
    const m = Math.hypot(dx, dy);
    player.dir = { x: dx / m, y: dy / m };
    player.x += dx / m * player.speed * dt;
    player.y += dy / m * player.speed * dt;
    player.walk += dt;
    if (dx) player.facing = Math.sign(dx);
  }
  player.hp = Math.min(player.maxHp, player.hp + player.regen * dt);
  player.invuln -= dt;

  spawnWave(dt);
  updateWeapons(dt);

  // Bullets (bolts and daggers)
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of enemies) {
      if (b.pierce > 0 && e.hp > 0 && dist2(b, e) < (b.r + e.r) ** 2 && e.lastBullet !== b) {
        e.lastBullet = b;
        damageEnemy(e, b.dmg, b.vx * 0.15, b.vy * 0.15);
        b.pierce--;
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0 && b.pierce > 0);

  // Enemies
  const despawn = (Math.hypot(W, H) + 400) ** 2;
  for (const e of enemies) {
    const d = Math.sqrt(dist2(e, player)) || 1;
    e.x += ((player.x - e.x) / d * e.speed + e.kx) * dt;
    e.y += ((player.y - e.y) / d * e.speed + e.ky) * dt;
    e.kx *= 0.88; e.ky *= 0.88;
    e.hit -= dt;
    if (e.orbitHit) e.orbitHit -= dt;
    if (d < e.r + player.r && player.invuln <= 0) {
      const dmg = Math.max(1, e.dmg - player.armor);
      player.hp -= dmg;
      player.invuln = 0.5;
      shake = Math.max(shake, 8);
      floatText(player.x, player.y - 30, '-' + dmg, '#ff4d6d', 14);
    }
    // Recycle far-away enemies around the player instead of letting them pile up off-screen
    if (e.type !== 'boss' && dist2(e, player) > despawn) {
      const a = rand(0, Math.PI * 2), r = Math.hypot(W, H) / 2 + 60;
      e.x = player.x + Math.cos(a) * r; e.y = player.y + Math.sin(a) * r;
    }
  }
  // Light separation so enemies don't stack into one blob
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    for (let j = i + 1; j < Math.min(enemies.length, i + 12); j++) {
      const b = enemies[j];
      const dx2 = b.x - a.x, dy2 = b.y - a.y, min = a.r + b.r, d2 = dx2 * dx2 + dy2 * dy2;
      if (d2 < min * min && d2 > 0) {
        const d = Math.sqrt(d2), push = (min - d) / 2;
        a.x -= dx2 / d * push; a.y -= dy2 / d * push;
        b.x += dx2 / d * push; b.y += dy2 / d * push;
      }
    }
  }
  for (const e of enemies) if (e.hp <= 0) killEnemy(e);
  enemies = enemies.filter(e => e.hp > 0);

  // Gems
  for (const g of gems) {
    const d = Math.sqrt(dist2(g, player));
    if (d < player.magnet) {
      const s = 420 * (1 - d / player.magnet) + 160;
      g.x += (player.x - g.x) / d * s * dt;
      g.y += (player.y - g.y) / d * s * dt;
    }
    if (d < player.r + g.r) {
      g.taken = true;
      if (g.heal) { player.hp = Math.min(player.maxHp, player.hp + 30); floatText(player.x, player.y - 30, '+30', '#5be37d', 14); }
      else gainXp(g.v);
    }
  }
  gems = gems.filter(g => !g.taken);

  // Chests open on touch
  for (const c of chests) {
    if (state === 'play' && dist2(c, player) < (player.r + 20) ** 2) { c.taken = true; openChest(c.kind); }
  }
  chests = chests.filter(c => !c.taken);

  // Effects
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= p.glow ? 0.98 : 0.92; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const t of texts) { t.y -= 40 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  for (const n of novas) { n.life -= dt; n.r = n.max * (1 - n.life / 0.4); }
  novas = novas.filter(n => n.life > 0);
  for (const r of rings) { r.life -= dt; }
  rings = rings.filter(r => r.life > 0);
  shake *= 0.85;

  if (player.hp <= 0) gameOver();
}

// ---------- Ranking ----------
function loadRuns() {
  try { return JSON.parse(localStorage.getItem('survivor-runs')) || []; } catch { return []; }
}
function saveRun(run) {
  const runs = [...loadRuns(), run].sort((a, b) => b.t - a.t || b.kills - a.kills).slice(0, 50);
  try { localStorage.setItem('survivor-runs', JSON.stringify(runs)); } catch {}
  return runs;
}
function renderRanking(el, highlightId) {
  const runs = loadRuns();
  if (!runs.length) { el.innerHTML = '<p>Aucune partie pour l\'instant. À toi de jouer !</p>'; return; }
  const top = runs.slice(0, 10);
  const pos = runs.findIndex(r => r.id === highlightId);
  // Keep the current run visible even when it didn't make the top 10
  const rows = top.map((r, i) => [r, i]);
  if (pos >= 10) rows.push([runs[pos], pos]);
  const medal = i => ['🥇', '🥈', '🥉'][i] ?? `#${i + 1}`;
  el.innerHTML = `<table class="rank"><tr><th>RANG</th><th>HEROS</th><th>TEMPS</th><th>NIV.</th><th>KILLS</th><th>DATE</th></tr>` +
    rows.map(([r, i]) => `<tr class="${r.id === highlightId ? 'me' : ''}"><td class="pos">${medal(i)}</td><td>${CHARACTERS[r.char]?.name ?? r.char}</td>
      <td>${fmtTime(r.t)}</td><td>${r.level}</td><td>${r.kills}</td><td>${new Date(r.id).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })}</td></tr>`).join('') + '</table>';
}

function gameOver() {
  const run = { id: Date.now(), char: player.char, t: Math.floor(time), level: player.level, kills };
  const runs = saveRun(run);
  const pos = runs.findIndex(r => r.id === run.id);
  lastRunId = run.id;
  document.getElementById('stats').innerHTML =
    `${CHARACTERS[player.char].name} · Survécu <b>${fmtTime(time)}</b> · Niveau <b>${player.level}</b> · <b>${kills}</b> ennemis vaincus` +
    (pos === 0 ? '<br><span style="color:#ffcc4d">🏆 Nouveau record !</span>' : pos >= 0 ? `<br>Classement : <b>#${pos + 1}</b>` : '');
  renderRanking(document.getElementById('overRank'), run.id);
  setState('gameover');
}

// ---------- Draw ----------
const T = () => performance.now() / 1000; // wall-clock time for idle animations (also runs in menus)

function drawGround() {
  const g = 64;
  const x0 = Math.floor((player.x - W / 2) / g) - 1, x1 = Math.ceil((player.x + W / 2) / g) + 1;
  const y0 = Math.floor((player.y - H / 2) / g) - 1, y1 = Math.ceil((player.y + H / 2) / g) + 1;
  ctx.fillStyle = '#1a2a1f';
  ctx.fillRect(x0 * g, y0 * g, (x1 - x0) * g, (y1 - y0) * g);
  for (let cy = y0; cy < y1; cy++) for (let cx = x0; cx < x1; cx++) {
    const h = hash(cx, cy);
    // Subtle tile shading so the field doesn't look flat
    if (h < 0.45) { ctx.fillStyle = h < 0.2 ? '#1d2f22' : '#17261c'; ctx.fillRect(cx * g, cy * g, g, g); }
    const d = hash(cx + 7919, cy - 104729);
    const ox = cx * g + 10 + hash(cx, cy + 31) * 40, oy = cy * g + 10 + hash(cx + 17, cy) * 40;
    const spr = d < 0.22 ? DECO.grass : d < 0.34 ? DECO.grass2 : d < 0.40 ? DECO.stone : d < 0.44 ? DECO.flower : d < 0.47 ? DECO.flower2 : d < 0.48 ? DECO.skull : null;
    if (spr) ctx.drawImage(spr.img, ox | 0, oy | 0);
  }
}

function drawShadow(x, y, w) { ctx.drawImage(shadowSpr, x - w / 2, y - w * 0.15, w, w * 0.3); }

function additive(fn) { ctx.globalCompositeOperation = 'lighter'; fn(); ctx.globalCompositeOperation = 'source-over'; }

function drawEnemy(e, t) {
  const sprs = SPR[e.type];
  let spr = sprs[0], sx = 1, sy = 1, bob = 0;
  if (e.type === 'grunt') { const s = Math.sin(t * 8 + e.phase) * 0.12; sx = 1 + s; sy = 1 - s; }
  else if (e.type === 'bat') { spr = sprs[Math.floor(t * 10 + e.phase) % 2]; bob = Math.sin(t * 6 + e.phase) * 4 - 8; }
  else if (e.type === 'brute') { bob = -Math.abs(Math.sin(t * 5 + e.phase)) * 3; }
  else if (e.type === 'boss') {
    bob = Math.sin(t * 3) * 3;
    additive(() => ctx.drawImage(glow('rgba(255,90,0,0.5)', 90), e.x - 90, e.y - 90));
  }
  drawShadow(e.x, e.y + spr.h * 0.42, spr.w * 0.8);
  drawSprite(spr, e.x, e.y + bob - spr.h * 0.1, { flip: player.x < e.x, sx, sy, white: e.hit > 0 });
  if (e.type === 'boss' || e.type === 'brute') {
    const w = spr.w * 0.8, y = e.y - spr.h * 0.6 + bob;
    ctx.fillStyle = '#0a0a12'; ctx.fillRect(e.x - w / 2 - 2, y - 2, w + 4, 8);
    ctx.fillStyle = '#4a0f1a'; ctx.fillRect(e.x - w / 2, y, w, 4);
    ctx.fillStyle = '#ff4d6d'; ctx.fillRect(e.x - w / 2, y, w * Math.max(0, e.hp / e.maxHp), 4);
  }
}

function drawPlayer(t) {
  const frame = player.moving ? Math.floor(player.walk * 8) % 2 : 0;
  const spr = SPR.chars[player.char][frame];
  const bob = player.moving ? -Math.abs(Math.sin(player.walk * 16)) * 3 : Math.sin(t * 2) * 1;
  const y = player.y + bob - spr.h * 0.1;
  drawShadow(player.x, player.y + spr.h * 0.42, spr.w * 0.7);
  // Blink semi-transparent (rather than vanishing) while invulnerable, so the player never loses sight of the hero
  if (player.invuln > 0 && Math.floor(player.invuln * 20) % 2 === 0) ctx.globalAlpha = 0.35;
  drawSprite(spr, player.x, y, { flip: player.facing < 0 });
  ctx.globalAlpha = 1;
  // Glowing staff tip for the spellcasters
  const tip = CHARACTERS[player.char].tip;
  if (tip) {
    const tipX = player.x + player.facing * (spr.w / 2 - 6), tipY = y - spr.h / 2 + 22;
    additive(() => ctx.drawImage(glow(tip, 14), tipX - 14, tipY - 14));
  }
}

function draw() {
  ctx.fillStyle = '#0b0d14';
  ctx.fillRect(0, 0, W, H);
  if (!player) return;
  const t = T();

  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.save();
  ctx.translate(Math.round(W / 2 - player.x + sx), Math.round(H / 2 - player.y + sy));

  drawGround();

  // Aura
  if (player.lv.aura) {
    const R = auraRadius() * (1 + Math.sin(t * 12) * 0.03);
    const evo = isEvo('aura');
    additive(() => {
      const grad = ctx.createRadialGradient(player.x, player.y, R * 0.2, player.x, player.y, R);
      grad.addColorStop(0, 'rgba(255,120,40,0)');
      grad.addColorStop(0.75, evo ? 'rgba(255,200,60,0.18)' : 'rgba(255,100,30,0.12)');
      grad.addColorStop(1, evo ? 'rgba(255,230,120,0.45)' : 'rgba(255,150,50,0.35)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(player.x, player.y, R, 0, Math.PI * 2); ctx.fill();
    });
  }

  // Meteor warning zones
  for (const m of meteors) {
    const k = 1 - m.t / 0.7;
    ctx.fillStyle = `rgba(255,60,30,${0.08 + k * 0.2})`;
    ctx.strokeStyle = `rgba(255,120,60,${0.4 + k * 0.5})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(m.x, m.y, m.R, m.R * 0.55, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Gems
  for (const gm of gems) {
    const bob = Math.sin(t * 4 + gm.phase) * 3;
    const spr = gm.heal ? SPR.heart : gm.v >= 5 ? SPR.bigGem : SPR.gem;
    additive(() => ctx.drawImage(glow(gm.heal ? 'rgba(255,77,109,0.45)' : gm.v >= 5 ? 'rgba(255,94,196,0.45)' : 'rgba(77,210,255,0.4)', 16), gm.x - 16, gm.y - 16 + bob));
    ctx.drawImage(spr.img, gm.x - spr.w / 2, gm.y - spr.h / 2 + bob);
  }

  // Chests: bobbing, glowing, with light rays
  for (const c of chests) {
    const ch = CHESTS[c.kind], bob = Math.sin(t * 3) * 3;
    additive(() => {
      ctx.drawImage(glow(ch.glow, 46), c.x - 46, c.y - 46 + bob);
      ctx.save(); ctx.translate(c.x, c.y + bob); ctx.rotate(t * 0.8);
      ctx.fillStyle = ch.glow.replace(/[\d.]+\)$/, '0.15)');
      for (let i = 0; i < 6; i++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-8, -60); ctx.lineTo(8, -60); ctx.fill(); }
      ctx.restore();
    });
    drawShadow(c.x, c.y + 16, 34);
    drawSprite(ch.spr, c.x, c.y + bob);
  }

  // Death rings
  for (const r of rings) {
    const k = r.life / r.max_life;
    ctx.strokeStyle = r.color; ctx.globalAlpha = k; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.max - (r.max - r.r) * k, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Enemies and player, depth-sorted by y
  enemies.sort((a, b) => a.y - b.y);
  let drewPlayer = false;
  for (const e of enemies) {
    if (!drewPlayer && e.y > player.y) { drawPlayer(t); drewPlayer = true; }
    drawEnemy(e, t);
  }
  if (!drewPlayer) drawPlayer(t);

  // Bolts: trail + glow + core; daggers: rotated sprite
  additive(() => {
    ctx.lineCap = 'round';
    for (const b of bullets) {
      if (b.kind !== 'bolt') continue;
      const evo = isEvo('bolt');
      ctx.strokeStyle = evo ? 'rgba(200,160,255,0.4)' : 'rgba(255,220,120,0.35)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.05, b.y - b.vy * 0.05); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.drawImage(glow(evo ? 'rgba(190,140,255,0.85)' : 'rgba(255,210,90,0.8)', 16), b.x - 16, b.y - 16);
    }
  });
  ctx.fillStyle = '#fffbe6';
  for (const b of bullets) {
    if (b.kind === 'bolt') { ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2); ctx.fill(); }
    else drawSprite(SPR.dagger, b.x, b.y, { rot: Math.atan2(b.vy, b.vx) });
  }

  // Boomerangs: spinning chevrons
  for (const b of booms) {
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(t * 16); ctx.scale(b.size, b.size);
    ctx.fillStyle = isEvo('boomerang') ? '#c9cfdc' : '#e0a050'; ctx.strokeStyle = '#0a0a12'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, -4); ctx.lineTo(10, -13); ctx.lineTo(13, -8); ctx.lineTo(-3, 0); ctx.lineTo(13, 8); ctx.lineTo(10, 13); ctx.lineTo(-12, 4);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Orbit blades: spinning shuriken
  if (player.lv.orbit) {
    const n = player.lv.orbit + 1 + isEvo('orbit') * 2, R = orbitRadius();
    for (let i = 0; i < n; i++) {
      const a = player.orbitAngle + i * Math.PI * 2 / n;
      const bx = player.x + Math.cos(a) * R, by = player.y + Math.sin(a) * R;
      additive(() => ctx.drawImage(glow(isEvo('orbit') ? 'rgba(200,140,255,0.7)' : 'rgba(120,220,255,0.6)', 22), bx - 22, by - 22));
      ctx.save();
      ctx.translate(bx, by); ctx.rotate(t * 14);
      ctx.fillStyle = '#d8f6ff'; ctx.strokeStyle = '#0a0a12'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const rr = k % 2 ? 4 : 12, aa = k * Math.PI / 4;
        ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  additive(() => {
    // Falling meteors
    for (const m of meteors) {
      const k = m.t / 0.7, mx = m.x - 260 * k, my = m.y - 420 * k;
      ctx.strokeStyle = 'rgba(255,140,50,0.5)'; ctx.lineWidth = 10; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(mx - 50, my - 80); ctx.lineTo(mx, my); ctx.stroke();
      ctx.drawImage(glow('rgba(255,150,60,0.9)', 26), mx - 26, my - 26);
      ctx.fillStyle = '#fff2c0'; ctx.beginPath(); ctx.arc(mx, my, 7, 0, Math.PI * 2); ctx.fill();
    }
    // Lightning bolts
    for (const s of strikes) {
      const k = s.life / 0.18;
      for (const [w, c] of [[9, `rgba(120,190,255,${0.5 * k})`], [3, `rgba(240,250,255,${k})`]]) {
        ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineJoin = 'round';
        ctx.beginPath(); s.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
      }
      ctx.drawImage(glow(`rgba(150,210,255,${0.8 * k})`, 30), s.x - 30, s.y - 30);
    }
    // Shockwaves
    for (const n of novas) {
      const k = n.life / 0.4;
      ctx.strokeStyle = `rgba(120,200,255,${k * 0.5})`; ctx.lineWidth = 18;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `rgba(220,245,255,${k})`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.stroke();
    }
  });

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    if (p.glow) ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = p.color; ctx.fillRect(p.x | 0, p.y | 0, p.r, p.r);
    if (p.glow) ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;

  // Floating texts
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  for (const tx of texts) {
    ctx.globalAlpha = Math.min(1, tx.life * 2);
    ctx.font = `${tx.size}px ${PX_FONT}`;
    ctx.strokeStyle = '#0a0a12'; ctx.lineWidth = 4;
    ctx.strokeText(tx.txt, tx.x, tx.y);
    ctx.fillStyle = tx.color; ctx.fillText(tx.txt, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.drawImage(vignette, 0, 0);
  // Pulsing red edges when low on health
  if (state === 'play' && player.hp / player.maxHp < 0.3) {
    ctx.globalAlpha = 0.35 + Math.sin(t * 6) * 0.15;
    ctx.drawImage(lowHpOverlay(), 0, 0);
    ctx.globalAlpha = 1;
  }

  if (state !== 'menu') drawHud(t);
}

let lowHpCanvas = null;
function lowHpOverlay() {
  if (!lowHpCanvas || lowHpCanvas.width !== W || lowHpCanvas.height !== H) {
    lowHpCanvas = document.createElement('canvas');
    lowHpCanvas.width = W; lowHpCanvas.height = H;
    const g = lowHpCanvas.getContext('2d');
    const grad = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.hypot(W, H) / 2);
    grad.addColorStop(0, 'rgba(255,26,60,0)'); grad.addColorStop(1, 'rgba(255,26,60,0.7)');
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
  }
  return lowHpCanvas;
}

function outlinedText(txt, x, y, size, color, align = 'left') {
  ctx.font = `${size}px ${PX_FONT}`;
  ctx.textAlign = align;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#0a0a12'; ctx.lineWidth = Math.max(3, size / 3);
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = color; ctx.fillText(txt, x, y);
}

function bar(x, y, w, h, k, back, fill, fill2) {
  ctx.fillStyle = '#0a0a12';
  ctx.beginPath(); ctx.roundRect(x - 3, y - 3, w + 6, h + 6, 6); ctx.fill();
  ctx.fillStyle = back;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 4); ctx.fill();
  if (k > 0) {
    const grad = ctx.createLinearGradient(0, y, 0, y + h);
    grad.addColorStop(0, fill2); grad.addColorStop(1, fill);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.roundRect(x, y, Math.max(h, w * Math.min(1, k)), h, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x + 4, y + 2, Math.max(0, w * Math.min(1, k) - 8), 2);
  }
}

function drawHud(t) {
  // XP bar across the top
  bar(12, 12, W - 24, 14, player.xp / player.xpNext, '#161a2b', '#1a8fd6', '#7fe3ff');
  outlinedText(`NIV ${player.level}`, W / 2, 24, 10, '#fff', 'center');

  // Timer
  outlinedText(fmtTime(time), W / 2, 62, 22, '#fff', 'center');

  // HP
  ctx.drawImage(SPR.heart.img, 14, 40);
  bar(44, 44, 200, 16, player.hp / player.maxHp, '#3a0d18', '#c4203f', '#ff7a90');
  outlinedText(`${Math.ceil(Math.max(0, player.hp))}/${player.maxHp}`, 144, 57, 9, '#fff', 'center');

  // Kills
  outlinedText(`${kills}`, W - 16, 58, 14, '#fff', 'right');
  ctx.drawImage(DECO.skull.img, W - 40 - ctx.measureText(`${kills}`).width, 42);

  // Arrows pointing to off-screen chests
  for (const c of chests) {
    const dx = c.x - player.x, dy = c.y - player.y;
    if (Math.abs(dx) < W / 2 - 30 && Math.abs(dy) < H / 2 - 30) continue;
    const a = Math.atan2(dy, dx), k = Math.min((W / 2 - 50) / Math.abs(Math.cos(a) || 1e-6), (H / 2 - 80) / Math.abs(Math.sin(a) || 1e-6));
    const ax = W / 2 + Math.cos(a) * k, ay = H / 2 + Math.sin(a) * k + Math.sin(t * 6) * 3;
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
    ctx.fillStyle = c.kind === 'gold' ? '#ffcc4d' : c.kind === 'silver' ? '#dfe6f5' : '#e0a050';
    ctx.strokeStyle = '#0a0a12'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -10); ctx.lineTo(-8, 10); ctx.closePath(); ctx.stroke(); ctx.fill();
    ctx.restore();
  }

  // Owned upgrades in slots (weapons first, gold border once evolved)
  let x = 14;
  for (const k of Object.keys(UPGRADES)) {
    const l = player.lv[k];
    if (!l) continue;
    const evo = player.evo[k];
    ctx.fillStyle = evo ? 'rgba(74,53,0,0.85)' : 'rgba(10,10,18,0.75)';
    ctx.beginPath(); ctx.roundRect(x, H - 58, 44, 44, 6); ctx.fill();
    ctx.strokeStyle = evo ? '#ffcc4d' : UPGRADES[k].type === 'weapon' ? '#4a5378' : '#2f3550'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = '22px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(evo ? EVOLUTIONS[k].icon : UPGRADES[k].icon, x + 22, H - 30);
    // Level pips
    for (let i = 0; i < UPGRADES[k].max; i++) {
      ctx.fillStyle = i < l ? '#ffcc4d' : '#2a3048';
      ctx.fillRect(x + 4 + i * (36 / UPGRADES[k].max), H - 20, 36 / UPGRADES[k].max - 1, 3);
    }
    x += 50;
  }
}

// ---------- Menu ----------
function renderChars() {
  const el = document.getElementById('chars');
  el.innerHTML = '';
  for (const [k, c] of Object.entries(CHARACTERS)) {
    const b = document.createElement('button');
    b.className = 'char' + (k === selectedChar ? ' sel' : '');
    b.innerHTML = `<img src="${SPR.chars[k][0].img.toDataURL()}" alt=""><div class="name">${c.name}</div>
      <div class="desc">${UPGRADES[c.weapon].icon} ${c.desc}<br>❤️ ${c.hp} PV</div>`;
    b.onclick = () => {
      selectedChar = k;
      try { localStorage.setItem('survivor-char', k); } catch {}
      newGame();
      renderChars();
    };
    b.ondblclick = start;
    el.appendChild(b);
  }
}
function showMenu() {
  newGame(); // gives the menu a scene to show behind it
  renderChars();
  renderRanking(document.getElementById('menuRank'), lastRunId);
  setState('menu');
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  // rAF timestamps can predate a `last` reset by a click handler, so never let dt go negative
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

function start() { newGame(); setState('play'); }
document.getElementById('startBtn').onclick = start;
document.getElementById('retryBtn').onclick = start;
document.getElementById('menuBtn').onclick = showMenu;
document.getElementById('resumeBtn').onclick = () => setState('play');
document.getElementById('quitBtn').onclick = gameOver;
